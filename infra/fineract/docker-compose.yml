name: yapesa-fineract
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: fineract
      POSTGRES_PASSWORD: ${FINERACT_DB_PASSWORD:?Run pnpm dev to create the local environment}
      POSTGRES_DB: fineract_tenants
    volumes:
      - fineract-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fineract -d fineract_tenants']
      interval: 5s
      timeout: 5s
      retries: 30
  fineract:
    image: apache/fineract:1.12.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8443:8443'
    environment:
      FINERACT_NODE_ID: '1'
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD:?Missing local password}
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: '5432'
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD:?Missing local password}
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: UTC
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Yapesa local demo
      FINERACT_DEFAULT_MASTER_PASSWORD: ${FINERACT_MASTER_PASSWORD:?Missing local master password}
      FINERACT_SERVER_SSL_ENABLED: 'true'
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info
      FINERACT_REMOTE_JOB_MESSAGE_HANDLER_SPRING_EVENTS_ENABLED: 'true'
      JAVA_TOOL_OPTIONS: '-Xmx1G --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED'
volumes:
  fineract-data:
