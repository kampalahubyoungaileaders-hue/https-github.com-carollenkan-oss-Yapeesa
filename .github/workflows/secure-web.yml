name: Secure web workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: secure-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secure-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable Supabase and apply migrations
        run: pnpm local:test-stack
      - run: pnpm local:provision
      - run: pnpm test:integration
      - name: Verify disposable backup and restore with security preserved
        run: node --env-file=.env scripts/verify-local-restore.mjs
      - name: Verify recovery into an empty independent database cluster
        run: node --env-file=.env scripts/verify-local-restore.mjs --fresh-cluster
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:live
      - name: Local Auth diagnostics on failure
        if: failure()
        run: docker logs --tail 100 supabase_auth_yapesa 2>&1 | tail -100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secure-web-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the disposable stack
        if: always()
        run: pnpm exec supabase stop
