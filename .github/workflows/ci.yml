name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm api:generate && git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.ts
      - run: pnpm mobile:export
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up
      - name: Verify pinned Fineract runtime
        run: docker compose --env-file .env -f infra/fineract/docker-compose.yml exec -T fineract java -version 2>&1 | tee /tmp/java-version.txt && grep -E 'version "21\.' /tmp/java-version.txt
      - run: pnpm smoke:stack
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/fineract/docker-compose.yml logs --tail 150
      - name: Stop local services without deleting volumes
        if: always()
        run: pnpm infra:down
